reachability = "pager rollback code compiled into the bundled build; ask creates its data directory and database with owner-only permissions and offers no import or restore"
impact = "conditional file-deletion trust boundary; ordinary bound prompt text does not create the required file structure"
disposition = "accepted residual risk"
owner = "repository owner"
review = "when a released crate pair bundles 3.53.3 or later, when import or restore of database state is proposed, or by the review deadline"

[[triage.items]]
