concern = "Handle a corrupt page size in a read-only WAL"
affected_versions = "absent from 3.53.2; first shipped in 3.53.3; also in 3.53.4"
trigger = "a WAL connection whose -shm file can be opened but not written, no other process holding its DMS lock, and a -wal file with an invalid header page size"
reachability = "WAL code compiled into the bundled build; production storage uses the rollback journal and never opens a WAL connection unless a -wal file is present next to the database"
