[triage]
# The owner accepted the linked version with the residual risk below on
# 2026-09-10; the record holds the reasoning. The acceptance is revisited when a
# released rusqlite and libsqlite3-sys pair bundles the revisit version or later.
record = "docs/reviews/sqlite-adoption-2026-09-10.md"
accepted_on = "2026-09-10"
revisit_when_bundled_sqlite_at_least = "3.53.3"
# Repository choice: the accepted residual risk is re-reviewed by this date even
# without an upstream trigger. Renew it in the same change as the review.
review_deadline = "2026-10-10"
# The newest upstream release and check-in already classified. A newer release
# on sqlite.org produces a triage item listing the check-ins after this one.
last_triaged_sqlite_release = "3.53.4"
last_triaged_sqlite_release_date = "2026-07-24"
# Release endpoint in the retained 80-entry 3.53.2-to-3.53.4 inventory.
last_triaged_check_in = "bf7c7f3003"

# One item per upstream fix absent from the linked version. Wording follows the
# adoption record; it does not extend what that record establishes.

[[triage.items]]
check_in = "6826c17021"
concern = "Reject index cells extending past the page end during an index search"
affected_versions = "absent from 3.53.2; first shipped in 3.53.3; also in 3.53.4"
trigger = "an indexed read of an already damaged database page; reachable with ordinary SQL once the file on disk is damaged, independent of SQL shape"
reachability = "core btree code compiled into the bundled build; ask reads its own index-backed tables on every query"
impact = "a missing rejection on a damaged file (demonstrated by the differential probe: the row is returned instead of SQLITE_CORRUPT); no demonstrated memory disclosure, exploitability, or healthy-write corruption path"
disposition = "accepted residual risk"
owner = "repository owner"
review = "when a released crate pair bundles 3.53.3 or later, or by the review deadline"

[[triage.items]]
check_in = "1a888ea60b"
concern = "Detect corrupt freelist chains on btree pages"
affected_versions = "absent from 3.53.2; first shipped in 3.53.3; also in 3.53.4"
trigger = "reads of an already damaged freelist; reachable with ordinary SQL once the file on disk is damaged"
reachability = "core btree code compiled into the bundled build"
impact = "weaker detection of damage in an already corrupt file; not a healthy-write corruption path"
disposition = "accepted residual risk"
owner = "repository owner"
review = "when a released crate pair bundles 3.53.3 or later, or by the review deadline"

[[triage.items]]
check_in = "9471fa2c9c"
