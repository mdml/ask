[package]
name = "ask"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/mdml/ask"
description = "Fast, opinionated terminal lookup tool for language models"
publish = false

[lib]
name = "ask"
path = "src/lib.rs"

[[bin]]
name = "ask"
path = "src/main.rs"

[dependencies]
directories = "=6.0.0"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
rig-core = { version = "=0.42.0", default-features = false, features = ["reqwest", "rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
tokio = { version = "=1.53.1", features = ["macros", "rt", "time"] }
toml = "=1.1.5"

sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite-bundled", "runtime-tokio"] }
