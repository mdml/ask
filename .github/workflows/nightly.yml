name: nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  nightly-deps:
    name: nightly-deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1

      - uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: cargo-deny@0.20.2

      - name: Advisory check
        run: cargo deny --locked check advisories

      - name: Dependency freshness (dry run)
        run: cargo update --dry-run

      # Report only: reads public sources, writes the job summary, never fails
      # on a finding, and runs even when the advisory check fails.
      - name: Native SQLite monitoring (report only)
        if: ${{ !cancelled() }}
        run: python3 scripts/sqlite-monitor.py
