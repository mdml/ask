name: per-commit

on:
  push:
    branches-ignore:
      - main
      - staging
  pull_request:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: per-commit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    env:
      CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy, llvm-tools

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2.87.2
        with:
          tool: cargo-llvm-cov@0.8.7,cargo-deny@0.20.2

      - name: Fast gate
        if: github.event_name == 'push'
        run: scripts/verify.sh

      - name: Full gate
        if: github.event_name == 'pull_request'
        env:
          ASK_VERIFY_BASE: origin/${{ github.base_ref }}
        run: scripts/verify.sh --full

  target-matrix:
    name: target ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            test: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            test: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            test: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            test: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: target-${{ matrix.target }}

      - name: Build
        run: cargo build --locked --target ${{ matrix.target }}

      - name: Test
        if: matrix.test
        run: cargo test --locked
