name: nightly-release

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-release-main
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: 1.97.1
  RELEASE_SHA: ${{ github.sha }}

jobs:
  prepare:
    if: >-
      github.repository == 'mdml/ask' &&
      github.ref == 'refs/heads/main' && github.ref_protected &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: release
        run: python3 scripts/nightly-release.py prepare

  verify-full:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy, llvm-tools
      - uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-llvm-cov@0.8.7,cargo-deny@0.20.2
      - name: Full gate for the immutable main revision
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        run: scripts/verify.sh --full --all

  build:
    needs: [prepare, verify-full]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - name: Native identity and production tests
        run: cargo +1.97.1 test --release --locked --target "$TARGET"
      - name: Build the production release binary
        run: cargo +1.97.1 build --release --locked --bin ask --target "$TARGET"
      - name: Verify SQLite linkage before stripping and package
        run: python3 scripts/nightly-release.py package --target "$TARGET" --destination package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-${{ matrix.target }}
          path: |
            package/ask-${{ matrix.target }}.tar.gz
            package/ask-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false

  attest:
    needs: [prepare, verify-full, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-aarch64-apple-darwin
          path: incoming/aarch64-apple-darwin
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-x86_64-apple-darwin
          path: incoming/x86_64-apple-darwin
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-aarch64-unknown-linux-gnu
          path: incoming/aarch64-unknown-linux-gnu
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-x86_64-unknown-linux-gnu
          path: incoming/x86_64-unknown-linux-gnu
          digest-mismatch: error
      - name: Verify complete inventory, archive and binary checksums, and source identity
        run: python3 scripts/nightly-release.py verify
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          push-to-registry: false
          subject-path: |
            release/ask-aarch64-apple-darwin.tar.gz
            release/ask-x86_64-apple-darwin.tar.gz
            release/ask-aarch64-unknown-linux-gnu.tar.gz
            release/ask-x86_64-unknown-linux-gnu.tar.gz
            release/SHA256SUMS

  publish:
    needs: [prepare, verify-full, build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-aarch64-apple-darwin
          path: incoming/aarch64-apple-darwin
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-x86_64-apple-darwin
          path: incoming/x86_64-apple-darwin
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-aarch64-unknown-linux-gnu
          path: incoming/aarch64-unknown-linux-gnu
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-x86_64-unknown-linux-gnu
          path: incoming/x86_64-unknown-linux-gnu
          digest-mismatch: error
      - name: Verify complete inventory, archive and binary checksums, and source identity
        run: python3 scripts/nightly-release.py verify
      - name: Publish the verified prerelease using GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
        shell: bash
        run: |
          set -euo pipefail
          # Create as draft so incomplete uploads never become installable.
          # No clobber or tag update: an existing tag/release is a hard failure.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$RELEASE_SHA" >/dev/null
          gh release create "$RELEASE_TAG" \
            release/ask-aarch64-apple-darwin.tar.gz \
            release/ask-x86_64-apple-darwin.tar.gz \
            release/ask-aarch64-unknown-linux-gnu.tar.gz \
            release/ask-x86_64-unknown-linux-gnu.tar.gz \
            release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" \
            --draft --prerelease --latest=false --verify-tag \
            --title "Nightly $RELEASE_TAG" \
            --notes "Verified main revision: $RELEASE_SHA. Archives contain ask, LICENSE, and manifest.json; SHA256SUMS and GitHub build attestations identify the assets."
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" | \
            python3 scripts/nightly-release.py verify-upload
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
