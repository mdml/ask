name: sqlite-readiness

on:
  workflow_dispatch:
  pull_request:
    branches: [staging]
    paths:
      - 'probes/sqlite-readiness/**'
      - 'scripts/sqlite-readiness.py'
      - '.github/workflows/sqlite-readiness.yml'

permissions:
  contents: read

jobs:
  probe:
    name: SQLite probe ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: Isolated release build, file probe, and linkage
        shell: bash
        run: python3 scripts/sqlite-readiness.py '${{ matrix.target }}' | tee -a "$GITHUB_STEP_SUMMARY"
